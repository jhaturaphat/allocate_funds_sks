services:
  mysql:
    image: mysql:8.4  
    container_name: sks-mysql8 
    environment:
      TZ: Asia/Bangkok
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:?Set MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER:?Set MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}"
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - ./mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+07:00
    restart: ${RESTART_POLICY:-no}
  php:
    container_name: sks-php 
    build: ./docker/php
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    restart: ${RESTART_POLICY:-no}

  nginx:
    container_name: sks-nginx 
    image: nginx:stable-alpine
    ports:
      - "0.0.0.0:8080:80"
    volumes:
      - ./src:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    restart: ${RESTART_POLICY:-no}